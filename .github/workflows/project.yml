name: Linux C++ project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc-debug, linux-gcc-release, linux-clang-debug, linux-clang-release]
    env:
      CPP_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # CMakeLists.txt calls find_package(CURL REQUIRED); the hosted ubuntu-24.04
      # image ships curl CLI but not the development headers. Dependency list and
      # rationale: docs/development.md "新 Linux 主机编译安装依赖".
      - name: Install libcurl development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          dpkg -s libcurl4-openssl-dev | grep -E '^(Package|Version|Status):'
      # Hosted runner toolchains are used; verify image versions against project policy.
      - name: Inspect CMake
        run: cmake --version
      - name: Inspect Ninja
        run: ninja --version
      - name: Record GCC version
        run: g++ --version
      - name: Record Clang version
        run: clang++ --version
      - name: Run strict project checks
        run: python scripts/check.py --strict-project

  # Terminal end-to-end smoke (design 007 §5.6 / 014 §6 / 015 §6): the pty
  # suites are the strongest regression net (TUI frame contract, approval
  # flows, provider retry/compact scenarios) and run against loopback mock
  # servers only -- no secrets, no external network. Kept out of
  # quality_commands (timing-sensitive, needs a pty) but gated here.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install libcurl development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Build and unit-test (gcc debug)
        run: python scripts/cpp_check.py --preset linux-gcc-debug
      - name: TUI pty smoke
        run: python tests/pty_tui_smoke.py ./build/linux-gcc-debug/mini-agent
      - name: CLI pty smoke
        run: python tests/pty_cli_smoke.py ./build/linux-gcc-debug/mini-agent

  # Static analysis + sanitizers on the Clang debug preset (same gate the
  # design docs record locally: tidy exit 0, ASan/UBSan ctest clean).
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install libcurl development headers and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev clang-tidy
      - name: clang-tidy + ASan/UBSan (clang debug)
        run: python scripts/cpp_check.py --preset linux-clang-debug --tidy --sanitizers
